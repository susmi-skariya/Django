<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>View Cart</h1>
    <table border="1">
        <tr>
            <th>Name</th>
            <th>Price</th>
            <th>Quantity</th>
        </tr>

        {% for i in cart %}
        <tr>
            <td>{{i.book.name}}</td>
            <td>{{i.book.price}}</td>
            <td>{{i.quantity}}</td>
            
            <td><a href="{% url 'buy' i.id %}">Buy</a></td>
        </tr>
        {% endfor %}

    </table>
    <a href="{% url 'view' %}">View</a>
</body>
</html>
